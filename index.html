<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Catalogue d'Images</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 20px; }
        .galerie { display: flex; flex-wrap: wrap; gap: 20px; }
        .carte { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 250px; }
        img { width: 100%; border-radius: 5px; height: 200px; object-fit: cover; }
        h3 { font-size: 16px; color: #333; }
        .prix { color: green; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Mon Portfolio d'Images</h1>

    <div class="galerie">
        <div class="carte">
            <img src="src/plan_de_Mais.jpg" alt="Plan de maison">
            <h3>Plan de Maison</h3>
            <p class="prix">Prix à discuter</p>
        </div>

        <div class="carte">
            <img src="src/Screenshot_20260507_154238_TikTok.jpg" alt="Capture TikTok">
            <h3>Article TikTok 1</h3>
            <p class="prix">10 000 FCFA</p>
        </div>

        <div class="carte">
            <img src="src/Screenshot_20260507_160848_TikTok.jpg" alt="Capture TikTok">
            <h3>Article TikTok 2</h3>
            <p class="prix">15 000 FCFA</p>
        </div>
    </div>

</body>
</html>
